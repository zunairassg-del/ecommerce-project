<style>
    /* Main container jisme sab products honge */
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); /* Auto-adjusts columns */
        gap: 25px;
        padding: 40px;
        max-width: 1200px;
        margin: auto;
    }

    /* Individual Product Card */
    .product-card {
        background: #ffffff;
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 15px;
        transition: all 0.3s ease;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    /* Card Hover Effect */
    .product-card:hover {
        box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        transform: translateY(-5px);
    }

    /* Image Styling */
   .product-card img {
    width: 100%;
    height: 400px; /* Thora chota height rakhein taake card balance lage */
    object-fit: cover;
    display: block; /* Important for alignment */
    border-radius: 10px;
    margin: 0 auto 15px auto; /* Image ke neeche margin */
}

    /* Typography */
    .product-card h3 {
        font-size: 18px;
        margin: 10px 0;
        color: #333;
    }

    .product-card p {
        font-size: 16px;
        font-weight: bold;
        color: #e67e22;
        margin-bottom: 15px;
    }

   .btn-upgrade {
        background: linear-gradient(45deg, #8e2de2, #4a00e0); /* Purple gradient */
        color: white !important;
        padding: 8px 20px !important;
        border-radius: 50px !important; /* Fully rounded corners */
        font-weight: 600;
        transition: 0.3s;
        border: none;
    }
    .btn-upgrade:hover {
        background: #333; /* Dark color on hover */
        transform: scale(1.05); /* Slight zoom effect */
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    

   .add-to-cart-btn {
        border: 2px solid #333;
        color: #333;
        padding: 10px 20px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }
    .add-to-cart-btn:hover {
        background-color: #333;
        color: white;
    }
    /* Navbar Container */
.nav-container {
        display: flex;
        flex-wrap: wrap; /* Screen choti hone par niche shift karega */
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background: #f8f9fa;
        border-bottom: 2px solid #ddd;
        gap: 10px;
    }

    /* Links/Buttons Group */
    .nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px; /* Buttons ke darmiyan gap */
        align-items: center;
    }

    /* Buttons ka size mobile ke liye set karein */
    .nav-link, .btn-upgrade, .btn-cart, .btn-logout {
        padding: 6px 12px;
        font-size: 14px;
        text-decoration: none;
        border-radius: 5px;
    }

.welcome-text {
  font-family: 'Segoe UI', sans-serif;
  font-size: 16px;
  color: #333;
}

/* Button Styles */
.nav-links {
  display: flex;
  gap: 15px; /* Spacing between buttons */
}

.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
}

/* Specific button colors */
.btn-upgrade { background-color: #6366f1; color: white; }
.btn-cart { background-color: #0ea5e9; color: white; }
.btn-logout { background-color: #ef4444; color: white; }

/* Hover Effects */
.btn:hover {
  filter: brightness(1.1);
  transform: translateY(-2px); /* Slight lift effect */
}
</style>
<nav class="nav-container">
    <div>Welcome, <strong>{{ user.username }}</strong></div>
    
    <div class="nav-links">
        <a class="btn-upgrade" href="{% url 'pricing' %}">Upgrade Plan</a>
        <a class="btn-cart" href="{% url 'view_cart' %}">View Cart</a>
        <form action="{% url 'logout' %}" method="post" style="margin: 0;">
            {% csrf_token %}
            <button type="submit" class="btn-logout" style="border:none; cursor:pointer;">Logout</button>
        </form>
    </div>
</nav>
<h2 style="text-align: center; margin-top: 40px; color: #0f172a;">Our Exclusive Collection</h2>



<div class="product-grid">
    {% for product in products %}
        <div class="product-card">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
            {% endif %}
            <h3>{{ product.name }}</h3>
            <p>Price: {{ product.price }} PKR</p>
            
   <a href="{% url 'add_to_cart' product.id %}" class="add-to-cart-btn">
    🛒 Add to Cart
</a>
    
    
        </div>
        
        
    {% endfor %}
</div>
