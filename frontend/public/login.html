<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            font-family: sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .login-container:hover { transform: translateY(-5px); }
        
        h1 { margin: 0 0 25px; font-size: 22px; color: #1e293b; text-align: center; }
        
        /* Django form 'p' tags ko handle karne ke liye */
        p { margin: 0; }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #008080;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 128, 128, 0.1);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #008080;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            background: #006666;
            box-shadow: 0 5px 15px rgba(0, 128, 128, 0.3);
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>Login Portal</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Access Account</button>
    </form>
</div>

</body>
</html>
