<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .cart-card { background: #ffffff; width: 100%; max-width: 500px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cart-header h2 { margin: 0; color: #0f172a; }
    .back-btn { color: #64748b; text-decoration: none; font-weight: 600; font-size: 14px; }
    .cart-item { display: flex; align-items: center; justify-content: space-between; border: 1px solid #f1f5f9; padding: 12px; border-radius: 10px; margin-bottom: 12px; background: #fafafa; }
    .item-info { display: flex; align-items: center; gap: 12px; }
    .item-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
    .item-title { margin: 0; font-size: 15px; font-weight: 600; color: #1e293b; }
    .item-qty { font-size: 12px; color: #64748b; }
    .item-price { font-weight: bold; color: #0f172a; }
    .total-section { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin: 20px 0; color: #0f172a; }
    .checkout-btn { width: 100%; background: #0f172a; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: block; }
    .checkout-btn:hover { background: #1e293b; }
    .empty-msg { text-align: center; color: #64748b; padding: 20px 0; font-weight: 600; }
    .clear-btn { background: transparent; border: none; color: #ef4444; font-size: 12px; cursor: pointer; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="cart-card">
    <div class="cart-header">
      <h2>Shopping Cart</h2>
      <a href="/" class="back-btn">← Back</a>
    </div>

    <!-- Dynamic Container where JS renders products -->
    <div id="cart-container"></div>

    <div class="total-section">
      <span>Total</span>
      <span id="cart-total">0 PKR</span>
    </div>

    <a href="/checkout.html" id="checkout-btn" class="checkout-btn">Proceed to Checkout</a>
  </div>

  <script>
    function renderCart() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let container = document.getElementById('cart-container');
      let totalEl = document.getElementById('cart-total');
      let checkoutBtn = document.getElementById('checkout-btn');

      if (cart.length === 0) {
        container.innerHTML = '<p class="empty-msg">Your cart is empty!</p>';
        totalEl.innerText = '0 PKR';
        checkoutBtn.style.display = 'none';
        return;
      }

      checkoutBtn.style.display = 'block';
      let html = '';
      let total = 0;

      cart.forEach((item, index) => {
        let itemTotal = item.price * item.qty;
        total += itemTotal;

        html += `
          <div class="cart-item">
            <div class="item-info">
              <img src="${item.image}" class="item-img" alt="${item.name}" onerror="this.src='https://via.placeholder.com/50'" />
              <div>
                <p class="item-title">${item.name}</p>
                <span class="item-qty">Qty: ${item.qty}</span>
                <br>
                <button onclick="removeItem(${index})" class="clear-btn">Remove</button>
              </div>
            </div>
            <div class="item-price">${itemTotal.toLocaleString()} PKR</div>
          </div>
        `;
      });

      container.innerHTML = html;
      totalEl.innerText = total.toLocaleString() + ' PKR';
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    // Load Cart items on Page Load
    document.addEventListener('DOMContentLoaded', renderCart);
  </script>

</body>
</html>
