<style>
    /* Full screen alignment */
    body, html { height: 100%; margin: 0; background-color: #f8fafc; }
    
    .main-container { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
    }

    .cart-wrapper { 
        width: 100%;
        max-width: 600px; 
        font-family: 'Inter', -apple-system, sans-serif;
        background: #ffffff;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    
    .cart-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 25px; 
    }
    .cart-header h1 { font-size: 24px; font-weight: 700; color: #1e293b; margin: 0; }
    .cart-header a { color: #64748b; text-decoration: none; font-size: 14px; font-weight: 500; }

    /* Cart Item Card Styling */
    .cart-item { 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        padding: 15px; 
        border: 1px solid #e2e8f0; 
        border-radius: 12px; 
        margin-bottom: 15px; 
    }

    .product-details { display: flex; align-items: center; gap: 15px; }
    .product-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    .product-name { font-weight: 600; font-size: 15px; color: #0f172a; }

    .item-meta { text-align: right; }
    .price-text { font-weight: 700; display: block; margin-bottom: 5px; color: #0f172a; }
    .remove-btn { color: #ef4444; font-size: 13px; text-decoration: none; font-weight: 500; }

    /* Summary Box */
    .summary-box { margin-top: 25px; padding-top: 20px; border-top: 2px solid #f1f5f9; }
    .total-row { display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #1e293b; }
    .checkout-btn { 
        display: block; 
        width: 100%; 
        padding: 16px; 
        background: #0f172a; 
        color: white; 
        text-align: center; 
        border-radius: 10px; 
        text-decoration: none; 
        font-weight: 600; 
        transition: background 0.3s;
    }
    .checkout-btn:hover { background: #334155; }
</style>

<div class="main-container">
    <div class="cart-wrapper">
        <div class="cart-header">
            <h1>Shopping Cart</h1>
            <a href="{% url 'product_list' %}">Back</a>
        </div>

        {% if products %}
            {% for product in products %}
            <div class="cart-item">
                <div class="product-details">
                    <img src="{{ product.image_url }}" alt="{{ product.name }}" class="product-img">
                    <div>
                        <div class="product-name">{{ product.name }}</div>
                        <div style="color: #64748b; font-size: 13px;">Qty: 1</div>
                    </div>
                </div>
                <div class="item-meta">
                    <span class="price-text">{{ product.price }} PKR</span>
                    <a href="{% url 'remove_from_cart' product.id %}" class="remove-btn">Remove</a>
                </div>
            </div>
            {% endfor %}

            <div class="summary-box">
                <div class="total-row">
                    <span>Total</span>
                    <span>{{ total }} PKR</span>
                </div>
                <a href="{% url 'checkout' %}" class="checkout-btn">Proceed to Checkout</a>
            </div>
        {% else %}
            <div style="text-align: center; padding: 40px; color: #64748b;">
                Your cart is empty.
            </div>
        {% endif %}
    </div>
</div>
