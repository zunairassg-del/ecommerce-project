<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        /* Navbar */
        .nav-container {
            display: flex; flex-wrap: wrap; justify-content: space-between;
            align-items: center; padding: 15px 20px; background: #f8f9fa;
            border-bottom: 2px solid #ddd; gap: 10px;
        }
        .nav-links { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-upgrade { background-color: #6366f1; color: white !important; }
        .btn-cart { background-color: #0ea5e9; color: white !important; }
        .btn-logout { background-color: #ef4444; color: white; cursor: pointer; }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; padding: 20px; max-width: 1200px; margin: auto;
        }
        .product-card {
            background: #fff; border: 1px solid #eee; border-radius: 12px;
            padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .product-card img {
            width: 100%; height: 250px; object-fit: cover; border-radius: 10px; margin-bottom: 10px;
        }
        .product-card h3 { font-size: 18px; margin: 10px 0; }
        .product-card p { font-size: 16px; font-weight: bold; color: #e67e22; margin-bottom: 15px; }
        
        .add-to-cart-btn {
            display: block; border: 2px solid #333; color: #333;
            padding: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; background: transparent; cursor: pointer; width: 100%;
        }
        .add-to-cart-btn:hover { background-color: #333; color: white; }
    </style>
</head>
<body>
    <!-- React yahan poore App component ko mount karega -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
